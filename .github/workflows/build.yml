name: Build debug APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        env:
          OWN_RU_HOST: ${{ secrets.OWN_RU_HOST }}
          OWN_RU_PORT: ${{ secrets.OWN_RU_PORT }}
          OWN_RU_SNI: ${{ secrets.OWN_RU_SNI }}
          OWN_SW_HOST: ${{ secrets.OWN_SW_HOST }}
          OWN_SW_PORT: ${{ secrets.OWN_SW_PORT }}
          OWN_SW_SNI: ${{ secrets.OWN_SW_SNI }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^e: ' build.log | head -10 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
          fi
          exit "$status"
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WhiteListCheck-diag-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhiteListCheck-diag
          path: WhiteListCheck-diag-debug.apk
