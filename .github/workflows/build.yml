name: Build debug APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WhiteListCheck-diag-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhiteListCheck-diag
          path: WhiteListCheck-diag-debug.apk
